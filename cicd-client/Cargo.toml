[package]
name = "cicd-client"
version = "0.1.0"
edition = "2021"
description = "基于 Rust + GPUI 的 Jenkins CI/CD 部署客户端"

[dependencies]
# GPUI - Zed 编辑器的 UI 框架
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（用于 Jenkins API 调用）
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }

# 错误处理
anyhow = "1"

[[bin]]
name = "cicd-client"
path = "src/main.rs"
