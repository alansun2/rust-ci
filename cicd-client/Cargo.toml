[package]
name = "cicd-client"
version = "0.1.0"
edition = "2021"
description = "基于 Rust + GPUI 的 Jenkins CI/CD 部署客户端"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
anyhow = "1"

[[bin]]
name = "cicd-client"
path = "src/main.rs"
